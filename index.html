  <!-- Global runtime error reporter: surfaces uncaught errors instead of failing silently -->
  <script>
    (function () {
      function showError(msg) {
        try {
          var existing = document.getElementById('global-error-banner');
          if (existing) return;
          var bar = document.createElement('div');
          bar.id = 'global-error-banner';
          bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7f1d1d;color:#fff;font:13px/1.4 system-ui,sans-serif;padding:10px 44px 10px 14px;box-shadow:0 -2px 12px rgba(0,0,0,.4)';
          bar.textContent = 'A script error occurred: ' + msg + ' — please reload. (Tap to dismiss)';
          bar.addEventListener('click', function () { bar.remove(); });
          (document.body || document.documentElement).appendChild(bar);
        } catch (e) {}
      }
      window.addEventListener('error', function (e) {
        showError((e && e.message) ? e.message : 'unknown error');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        showError((r && r.message) ? r.message : String(r));
      });
    })();
  </script>
